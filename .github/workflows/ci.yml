name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: backend_nest_boilerplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backend_nest_boilerplate_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backend_nest_boilerplate_test?schema=public
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_SECRET: ci-only-secret
      JWT_ISSUER: backend-nest-boilerplate
      JWT_AUDIENCE: backend-nest-boilerplate
      INTEGRATION_MOBILE_APP_CLIENT_ID: mobile-app
      INTEGRATION_MOBILE_APP_CLIENT_SECRET: mobile-app-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # tsc is the only type checker here: neither oxlint nor @swc/jest type-check.
      - name: Build (type gate)
        run: npm run build

      - run: npm run lint

      - run: npm run format:check

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - run: npm test
